<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MasterOS — Flow Helper</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #edf3fb;
        --panel: rgba(255, 255, 255, 0.96);
        --border: #d6e1ef;
        --text: #17324d;
        --muted: #64748b;
        --accent: #0f9fb0;
        --accent-dark: #0a7181;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #f4f7fc 0%, var(--bg) 100%);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        min-width: 0;
      }

      .shell {
        min-height: 100vh;
        padding: 18px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 18px;
        box-shadow: 0 16px 40px rgba(15, 35, 60, 0.1);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .subhead {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .stack {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .value {
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fbfdff;
        font-size: 14px;
        word-break: break-word;
      }

      .value.empty {
        color: var(--muted);
      }

      textarea.value,
      select.value {
        width: 100%;
        min-height: 0;
        color: var(--text);
        resize: vertical;
        font: inherit;
      }

      textarea.value {
        min-height: 128px;
      }

      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: var(--accent-dark);
      }

      button.secondary {
        background: #e9f0fa;
        color: var(--text);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 999px;
        background: #eef8fa;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 600;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
      }

      .log-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .log-header button {
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 12px;
      }

      .log-box {
        min-height: 180px;
        max-height: 260px;
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #0f172a;
        color: #d8e6ff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .log-box.empty {
        color: #94a3b8;
      }

      .token-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }

      .token-value {
        min-height: 40px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fbfdff;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        line-height: 1.5;
      }

      .token-value.empty {
        color: var(--muted);
      }

      .copy-inline {
        flex-shrink: 0;
        padding: 9px 14px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 600;
        background: #e9f0fa;
        color: var(--text);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <h1>MasterOS</h1>
        <div class="subhead">Flow Helper — Automatically send tokens to MasterOS (port 8765)</div>

        <div class="stack">
          <div id="status-pill" class="status">
            <span class="dot"></span>
            <span id="status-text">Checking active tab</span>
          </div>

          <div class="field">
            <div class="label">Project ID</div>
            <div class="token-row">
              <div id="project-id" class="token-value empty">Open a Google Flow tab to detect a project ID.</div>
              <button id="copy-project-inline" class="copy-inline" type="button" disabled>Copy</button>
            </div>
          </div>

          <div class="field">
            <div class="label">Access Key (Bearer Token)</div>
            <div class="token-row">
              <div id="bearer-token" class="token-value empty">Not captured yet — trigger a generate in Flow</div>
              <button id="copy-bearer" class="copy-inline" type="button" disabled>Copy</button>
            </div>
          </div>

          <div class="field">
            <div class="label">Session Cookie</div>
            <div class="token-row">
              <div id="session-cookie" class="token-value empty">Not captured yet — open a Flow tab</div>
              <button id="copy-session-cookie" class="copy-inline" type="button" disabled>Copy</button>
            </div>
          </div>

          <div id="source" hidden></div>
          <select id="model-select" hidden>
            <option value="Nano Banana Pro">Nano Banana Pro</option>
            <option value="Nano Banana 2">Nano Banana 2</option>
            <option value="Imagen 4">Imagen 4</option>
          </select>

          <div class="field">
            <label class="label" for="prompt-input">Prompt</label>
            <textarea id="prompt-input" class="value" placeholder="Enter a prompt for Google Flow">a cat</textarea>
          </div>

          <div class="button-row">
            <button id="create-project" class="primary" type="button">Get Token</button>
            <button id="refresh" class="secondary" type="button">Refresh</button>
          </div>

          <button id="open-flow" class="secondary" type="button">Open Google Flow</button>

          <div class="field">
            <div class="log-header">
              <div class="label">Logs</div>
              <button id="clear-logs" class="secondary" type="button">Clear Logs</button>
            </div>
            <div id="log-box" class="log-box empty">No logs yet.</div>
          </div>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
  </html>
